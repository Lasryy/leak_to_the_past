name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leak-to-the-past-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax and gameplay rules
        run: npm test && node --check web/game.mjs && node --check web/logic.mjs
      - name: Build static browser edition
        run: npm run build
      - name: Deploy static site to webversion
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: webversion
          folder: dist
