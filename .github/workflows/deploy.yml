name: Check original Python game

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python source without installing runtime dependencies
        run: python -m py_compile main.py sprites.py settings.py

# IMPORTANT: master is the original Python source branch.
# The browser port's own branch port/javascript builds and deploys to webversion.
# DO NOT publish Pygbag from this workflow; it would overwrite the browser demo.
